<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4ecdf">
  <title>Галя, с днём рождения!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="refinement.css">
</head>
<body>
  <main class="page">
    <div class="celebration" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <header class="hero-copy">
      <span class="eyebrow">24 · 09 · 2026</span>
      <h1>Галя, с днём рождения!</h1>
      <p><strong>Твой подарок ждёт тебя</strong></p>
    </header>

    <section class="reveal" aria-label="Подарок со стираемым защитным слоем">
      <div class="prize">
        <div class="spark spark--one">✦</div><div class="spark spark--two">✦</div>
        <span class="prize__kicker">ТВОЙ ПОДАРОК</span>
        <strong>2 билета</strong>
        <span class="prize__destination">в PortAventura</span>
        <div class="mini-tickets" aria-hidden="true">
          <span><i>ADMIT ONE</i>PORT<br><b>AVENTURA</b></span><span><i>ADMIT ONE</i>PORT<br><b>AVENTURA</b></span>
        </div>
      </div>
      <canvas id="scratch" aria-label="Сотри защитный слой, чтобы узнать подарок"></canvas>
      <div class="scratch-hint" id="hint"><span>Скорее сотри<br>защитный слой</span></div>
    </section>

    <p class="instruction" id="instruction">Проведи пальцем или курсором по золотому кругу</p>
    <button class="reset" id="reset" type="button">Стереть заново</button>
    <div class="success" id="success" role="status" aria-hidden="true"></div>
  </main>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="script.js"></script>
</body>
</html>
